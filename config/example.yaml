routes:
  - id: anywhere-topic
    method: POST
    path: /anywhere
    sink:
      type: sns
      topicArn: arn:aws:sns:us-east-1:123456789012:my-topic

  - id: queue-input
    method: POST
    path: /my-queue
    sink:
      type: sqs
      queueUrl: https://sqs.us-east-1.amazonaws.com/123456789012/my-queue

  - id: dynamic-file
    method: POST
    path: /file/{bucket}/{filename}
    sink:
      type: s3
      bucket: "{{ params.bucket }}"
      key: "{{ params.filename }}"
